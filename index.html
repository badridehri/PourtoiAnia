<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clique ici si t’es curieuse 😏</title>

  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    button {
      background: #fff;
      color: #ff4b5c;
      font-size: 1.4rem;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background: #ff4b5c;
      color: white;
    }

    #message {
      margin-top: 30px;
      color: #fff;
      font-size: 1.3rem;
      max-width: 400px;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.5s;
    }

    footer {
      position: absolute;
      bottom: 10px;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
    }

    /* ===== PLAQUE FINALE ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.4s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .plaque {
      background: white;
      padding: 40px 60px;
      border-radius: 25px;
      font-size: 2rem;
      color: #ff4b5c;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform: scale(0.7);
      transition: 0.4s;
    }

    .overlay.active .plaque {
      transform: scale(1);
    }
  </style>
</head>

<body>

  <h1>Clique ici si t’es curieuse 😏</h1>
  <button id="clickBtn">Clique ici 💖</button>
  <div id="message"></div>

  <footer>Un petit jeu créé spécialement pour toi, Mouni 💘</footer>

  <!-- PLAQUE -->
  <div class="overlay" id="overlay">
    <div class="plaque">cbn matdsrinich 😭💘</div>
  </div>

  <script>
    const messages = [
      "Hey 😳",
      "n3adek m nifek 😂",
      "Encore un clic ? 😏",
      "Curieuse hein 👀",
      "Tu cliques trop 😌",
      "C’est juste pour te faire sourire psq 3labali bli raki tdahki mdrrr 😂💕",
      "Ok petit secret 🤫",
      "T’es adorable ya chaba 😍",
      "Dernier clic 👇",
      "Félicitations 🥳 t’as gagné…",
      "💘 MON CŒUR 💘"
    ];

    let index = 0;
    const messageDiv = document.getElementById("message");
    const button = document.getElementById("clickBtn");
    const overlay = document.getElementById("overlay");

    button.addEventListener("click", () => {
      messageDiv.style.opacity = 0;

      setTimeout(() => {
        messageDiv.textContent = messages[index];
        messageDiv.style.opacity = 1;
        index++;

        if (index >= messages.length) {
          button.disabled = true;
          button.textContent = "💞 Fin du jeu 💞";

          setTimeout(() => {
            overlay.classList.add("active");
          }, 800);
        }
      }, 200);
    });
  </script>

</body>
</html>
